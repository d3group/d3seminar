name: Test and publish seminar site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Check sender and response handling
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --check site/api.js
          node --check site/app.js
          node --check site/admin.js
          node --check site/home.js
          node --check site/about.js
          node --check site/agenda.js
          node --check site/shared.js
          node --test tests/programme.mjs
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure the hosted API
        env:
          D3_API_URL: ${{ vars.D3_API_URL }}
          D3_SITE_URL: ${{ vars.D3_SITE_URL }}
        run: python3 scripts/configure_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
